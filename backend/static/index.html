<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Data Fetcher</title>
</head>
<body>
    <h1>Get Financial Data</h1>

    <!-- Form to input company ticker -->
    <form id="tickerForm">
        <label for="ticker">Enter Ticker:</label>
        <input type="text" id="ticker" name="ticker" required>
        <button type="submit">Get Financial Data</button>
    </form>

    <h2>Financial Data:</h2>
    <pre id="response"></pre>

    <script>
        // Handle form submission
        document.getElementById('tickerForm').addEventListener('submit', async function (e) {
            e.preventDefault();  // Prevent the default form submission

            const ticker = document.getElementById('ticker').value;
            
            if (!ticker) {
                alert('Please provide a ticker.');
                return;
            }

            // Send POST request with JSON data to the Flask backend
            const response = await fetch('http://localhost:5000/api/financials', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ticker })
            });

            // Parse the response
            const data = await response.json();

            // Display the response in the pre tag
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
